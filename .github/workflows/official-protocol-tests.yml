name: Official protocol checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas scikit-learn matplotlib seaborn tqdm

      - name: Compile official training entrypoints
        run: |
          python -m py_compile cd_former_official.py
          python -m py_compile scripts/kaggle_train_official.py
          python -m py_compile tests/test_official_protocol.py

      - name: Run official protocol tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
